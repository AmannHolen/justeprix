<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Le Juste Prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#120B2E;
    --stage:#1A1140;
    --panel:#241748;
    --panel-light:#2E1E5C;
    --gold:#F4C430;
    --gold-deep:#D9A400;
    --pink:#FF3D7F;
    --mint:#2FE6A0;
    --text:#F4F1FF;
    --muted:#B7ACDD;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 50% -10%, #3B2478 0%, var(--ink) 55%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{width:100%;max-width:1100px;padding:18px;padding-bottom:60px;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;}
  .eyebrow{
    font-family:'Space Grotesk',monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--gold);
    font-weight:600;
  }
  .num{font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums;}
  .center{text-align:center;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .card{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius);
    padding:22px;
  }
  .btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
    background:var(--gold);
    border:none;
    border-radius:14px;
    padding:14px 22px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 4px 0 var(--gold-deep);
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep);}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .btn.secondary{
    background:transparent;
    color:var(--text);
    border:2px solid var(--panel-light);
    box-shadow:none;
  }
  .btn.pink{background:var(--pink);box-shadow:0 4px 0 #B3255C;color:#fff;}
  .btn.big{padding:22px 30px;font-size:22px;width:100%;}
  input[type=text], input[type=number], input[type=url]{
    font-family:'Inter',sans-serif;
    font-size:16px;
    background:var(--ink);
    border:2px solid var(--panel-light);
    color:var(--text);
    border-radius:10px;
    padding:12px 14px;
    width:100%;
  }
  input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  label{font-size:13px;color:var(--muted);font-weight:600;}

  /* ROLE SELECT */
  .role-choice{max-width:520px;margin:8vh auto 0;}
  .role-btn{
    display:flex;align-items:center;gap:16px;
    background:var(--panel);
    border:2px solid var(--panel-light);
    border-radius:var(--radius);
    padding:22px;
    cursor:pointer;
    text-align:left;
    width:100%;
    color:var(--text);
  }
  .role-btn:hover{border-color:var(--gold);}
  .role-btn .emoji{font-size:36px;}
  .role-btn .title{font-family:'Baloo 2';font-weight:700;font-size:20px;}
  .role-btn .desc{color:var(--muted);font-size:13px;margin-top:2px;}

  /* PRICE TAG (signature element) */
  .price-tag{
    position:relative;
    background:linear-gradient(160deg, var(--panel-light), var(--panel));
    border-radius:16px 16px 16px 60px;
    padding:26px 26px 26px 40px;
    border:2px solid rgba(244,196,48,.35);
    margin:0 auto;
  }
  .price-tag::before{
    content:"";
    position:absolute;
    left:16px; top:50%;
    width:14px;height:14px;
    background:var(--ink);
    border:2px solid var(--gold);
    border-radius:50%;
    transform:translateY(-50%);
  }
  .price-tag .obj-title{font-family:'Baloo 2';font-size:26px;font-weight:700;}
  .price-tag img{max-width:100%;max-height:220px;border-radius:12px;margin:14px auto;display:block;}
  .price-tag .price-reveal{
    font-family:'Space Grotesk';font-weight:700;font-size:40px;color:var(--gold);
  }

  /* LOBBY / QR */
  .qr-wrap{background:#fff;padding:14px;border-radius:16px;display:inline-block;}
  .code-badge{
    font-family:'Space Grotesk';font-weight:700;letter-spacing:.12em;
    background:var(--ink);color:var(--gold);padding:8px 16px;border-radius:10px;
    display:inline-block;font-size:20px;border:2px dashed var(--gold);
  }
  .roster-chip{
    background:var(--panel-light);border-radius:20px;padding:8px 14px;
    font-size:14px;display:flex;align-items:center;gap:6px;
  }

  /* LEADERBOARD */
  .lb-row{
    display:flex;align-items:center;gap:14px;
    background:var(--panel-light);
    border-radius:14px;padding:12px 16px;
  }
  .lb-row .rank{font-family:'Space Grotesk';font-weight:700;font-size:18px;width:28px;color:var(--muted);}
  .lb-row .name{flex:1;font-weight:600;}
  .lb-row .score{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:var(--gold);}
  .lb-row.me{outline:2px solid var(--mint);}
  .lb-row.top1{background:linear-gradient(90deg, rgba(244,196,48,.25), var(--panel-light));}

  /* PODIUM */
  .podium{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin-top:30px;}
  .podium .place{
    background:var(--panel-light);border-radius:16px 16px 0 0;
    text-align:center;padding:14px 10px;width:110px;
  }
  .podium .place .medal{font-size:34px;}
  .podium .place .name{font-weight:700;margin:6px 0 2px;font-size:14px;}
  .podium .place .score{color:var(--gold);font-family:'Space Grotesk';font-weight:700;}
  .podium .p1{height:180px;order:2;border-top:4px solid var(--gold);}
  .podium .p2{height:130px;order:1;border-top:4px solid #C9CBD8;}
  .podium .p3{height:100px;order:3;border-top:4px solid #C77B4A;}

  .answer-grid{display:flex;flex-direction:column;gap:8px;}
  .answer-row{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-light);border-radius:12px;padding:10px 14px;
  }
  .answer-row .medal{width:26px;text-align:center;}
  .answer-row .name{flex:1;font-weight:600;}
  .answer-row .val{font-family:'Space Grotesk';font-weight:600;}
  .answer-row .pts{font-family:'Space Grotesk';font-weight:700;color:var(--gold);}
  .setup-item{border:1px solid var(--panel-light);border-radius:14px;padding:14px;}
  .badge-idx{
    background:var(--gold);color:var(--ink);font-family:'Space Grotesk';font-weight:700;
    border-radius:8px;padding:2px 8px;font-size:13px;
  }
  .muted{color:var(--muted);}
  .small{font-size:13px;}
  .footer-actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
  @media (max-width:640px){
    .podium .place{width:90px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>


/* ---------------- API client (backed by /api/kv + /api/players, Vercel + Upstash Redis) ---------------- */
async function safeGet(key){
  try{
    const r = await fetch(`/api/kv?key=${encodeURIComponent(key)}`);
    if(!r.ok) return null;
    const data = await r.json();
    return (data.value === undefined || data.value === null) ? null : data.value;
  }catch(e){ return null; }
}
async function safeSet(key, value){
  try{
    const r = await fetch('/api/kv', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({key, value}) });
    return r.ok;
  }catch(e){ console.error('kv set failed', key, e); return false; }
}
async function safeDelete(key){
  try{ await fetch(`/api/kv?key=${encodeURIComponent(key)}`, { method:'DELETE' }); }catch(e){}
}
async function getPlayers(sid){
  try{
    const r = await fetch(`/api/players?session=${encodeURIComponent(sid)}`);
    if(!r.ok) return {};
    const data = await r.json();
    return data.players || {};
  }catch(e){ return {}; }
}
async function setPlayer(sid, pid, doc){
  try{
    await fetch('/api/players', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session:sid, playerId:pid, doc}) });
  }catch(e){ console.error('player save failed', e); }
}

const kCurrentSession = 'jlp-current-session';
const kHost = id => `jlp-host-${id}`;

function randCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : ('p'+Date.now()+Math.random())).replace(/-/g,'');
}
function euro(n){
  if(n===undefined||n===null||isNaN(n)) return '—';
  return Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
}
function defaultQuestions(){
  const titles = [
    "Un grille-pain 2 fentes","Une trottinette électrique","Un aspirateur robot",
    "Une machine à café à dosettes","Un vélo électrique","Des écouteurs sans fil",
    "Un barbecue à gaz 3 feux","Une friteuse sans huile","Un sac à main de marque",
    "Une montre connectée","Un canapé 3 places","Une tondeuse à gazon électrique",
    "Un appareil photo reflex","Une console de jeux vidéo","Un robot pâtissier"
  ];
  return titles.map(t => ({title:t, price:'', image:'', description:''}));
}
function defaultHostState(){
  return { phase:'setup', questions: defaultQuestions(), currentIndex:-1, results:{} };
}

/* ---------------- App state ---------------- */
let role = null;           // 'host' | 'player'
let sessionId = null;
let hostState = null;
let playerId = null;
let playerName = '';
let playerDoc = null;
let playersMap = {};       // pid -> {name, joinedAt, answers}
let answeredCount = null;  // local-only, host side "check answers" result
let errorMsg = '';
let pollHandle = null;
let lastSignature = null;

function sig(hs){
  return JSON.stringify({ p: hs.phase, i: hs.currentIndex, rk: Object.keys(hs.results||{}).sort() });
}

/* ---------------- Polling ---------------- */
async function refreshRosterOnce(){
  playersMap = await getPlayers(sessionId);
  const rosterList = document.getElementById('roster-list');
  const rosterCount = document.getElementById('roster-count');
  if(rosterList && rosterCount){
    const roster = Object.entries(playersMap).map(([id,d]) => ({id, name:d.name}));
    rosterCount.textContent = roster.length;
    rosterList.innerHTML = roster.map(p => `<div class="roster-chip">🙋 ${p.name}</div>`).join('') || `<span class="muted small">En attente de joueurs…</span>`;
  } else {
    render();
  }
}
function startHostLobbyPolling(){
  clearInterval(pollHandle);
  const tick = () => {
    if(hostState && hostState.phase === 'lobby') refreshRosterOnce();
    else clearInterval(pollHandle);
  };
  tick();
  pollHandle = setInterval(tick, 1500);
}
function playerPollLoop(){
  clearInterval(pollHandle);
  const tick = async () => {
    if(!sessionId) return;
    const hs = await safeGet(kHost(sessionId));
    if(!hs) return;
    const s = sig(hs);
    if(s !== lastSignature){
      lastSignature = s;
      hostState = hs;
      playersMap = await getPlayers(sessionId);
      render();
    }
  };
  tick();
  pollHandle = setInterval(tick, 1200);
}
function playerWaitForSession(){
  clearInterval(pollHandle);
  const tick = async () => {
    const sid = await safeGet(kCurrentSession);
    if(sid){
      sessionId = sid;
      const hs = await safeGet(kHost(sessionId));
      if(hs){
        hostState = hs;
        playersMap = await getPlayers(sessionId);
        clearInterval(pollHandle);
        render();
        playerPollLoop();
      }
    }
  };
  tick();
  pollHandle = setInterval(tick, 1000);
}

/* ---------------- Ranking ---------------- */
async function computeAndReveal(){
  playersMap = await getPlayers(sessionId);
  const q = hostState.questions[hostState.currentIndex];
  const price = parseFloat(q.price);
  const entries = [];
  Object.entries(playersMap).forEach(([pid, doc]) => {
    const ans = doc.answers ? doc.answers[hostState.currentIndex] : undefined;
    if(ans === undefined || ans === null || ans === '') return;
    const val = parseFloat(ans);
    if(isNaN(val)) return;
    entries.push({ id: pid, name: doc.name || '???', answer: val, distance: Math.abs(val - price) });
  });
  entries.sort((a,b) => a.distance - b.distance);
  entries.forEach((e,idx) => { e.points = idx===0?3: idx===1?2: idx===2?1: 0; });
  hostState.results[hostState.currentIndex] = entries;
  hostState.phase = 'reveal';
  await saveHostState();
}

function overallTotals(){
  const totals = {};
  Object.entries(playersMap).forEach(([pid, doc]) => { totals[pid] = {id:pid, name:doc.name, score:0}; });
  Object.values(hostState.results||{}).forEach(list => {
    (list || []).forEach(e => {
      if(!totals[e.id]) totals[e.id] = {id:e.id, name:e.name, score:0};
      totals[e.id].score += e.points;
    });
  });
  return Object.values(totals).sort((a,b) => b.score - a.score);
}

/* ---------------- Persistence ---------------- */
async function saveHostState(){
  await safeSet(kHost(sessionId), hostState);
  render();
}
async function savePlayerDoc(){
  await setPlayer(sessionId, playerId, playerDoc);
}

/* ---------------- Host actions ---------------- */
async function loadQuestionsConfig(){
  try{
    const r = await fetch('/questions.json', { cache: 'no-store' });
    if(!r.ok) return null;
    const data = await r.json();
    if(!Array.isArray(data) || data.length === 0) return null;
    return data.map(q => ({
      title: (q.nom ?? q.title ?? '').toString(),
      price: (q.valeur ?? q.prix ?? q.price ?? '').toString(),
      image: (q.image ?? '').toString(),
      description: (q.description ?? '').toString()
    }));
  }catch(e){ return null; }
}
async function hostCreateSession(){
  sessionId = randCode();
  const loaded = await loadQuestionsConfig();
  hostState = { phase:'setup', questions: (loaded && loaded.length) ? loaded : defaultQuestions(), currentIndex:-1, results:{} };
  playersMap = {};
  await safeSet(kHost(sessionId), hostState);
  await safeSet(kCurrentSession, sessionId);
  role = 'host';
  render();
}
async function hostValidateSetup(){
  if(hostState.questions.length === 0){ errorMsg = "Ajoute au moins une question avant de continuer."; render(); return; }
  const bad = hostState.questions.some(q => !q.title.trim() || isNaN(parseFloat(q.price)) || parseFloat(q.price) <= 0);
  if(bad){ errorMsg = "Merci de remplir un titre et un prix (> 0) pour chaque question."; render(); return; }
  errorMsg='';
  hostState.phase = 'lobby';
  await saveHostState();
  startHostLobbyPolling();
}
function hostAddQuestion(){
  hostState.questions.push({ title:'', price:'', image:'', description:'' });
  render();
}
function hostRemoveQuestion(i){
  hostState.questions.splice(i, 1);
  render();
}
function startHostQuestionPolling(){
  clearInterval(pollHandle);
  const tick = async () => {
    if(!hostState || hostState.phase !== 'question'){ clearInterval(pollHandle); return; }
    playersMap = await getPlayers(sessionId);
    const idx = hostState.currentIndex;
    let count = 0;
    Object.values(playersMap).forEach(doc => {
      const ans = doc.answers ? doc.answers[idx] : undefined;
      if(ans !== undefined && ans !== null && ans !== '') count++;
    });
    answeredCount = count;
    const total = Object.keys(playersMap).length;
    if(total > 0 && count >= total){
      clearInterval(pollHandle);
      await hostReveal();
    } else {
      render();
    }
  };
  tick();
  pollHandle = setInterval(tick, 1200);
}
async function hostStartGame(){
  clearInterval(pollHandle);
  hostState.currentIndex = 0;
  hostState.phase = 'question';
  answeredCount = null;
  await saveHostState();
  startHostQuestionPolling();
}
async function hostCheckAnswers(){
  playersMap = await getPlayers(sessionId);
  const idx = hostState.currentIndex;
  let count = 0;
  Object.values(playersMap).forEach(doc => {
    const ans = doc.answers ? doc.answers[idx] : undefined;
    if(ans !== undefined && ans !== null && ans !== '') count++;
  });
  answeredCount = count;
  render();
}
async function hostReveal(){ clearInterval(pollHandle); await computeAndReveal(); }
async function hostGoLeaderboard(){ hostState.phase='leaderboard'; await saveHostState(); }
async function hostNextOrPodium(){
  clearInterval(pollHandle);
  if(hostState.currentIndex < hostState.questions.length - 1){
    hostState.currentIndex += 1;
    hostState.phase = 'question';
    answeredCount = null;
    await saveHostState();
    startHostQuestionPolling();
  } else {
    hostState.phase = 'podium';
    await saveHostState();
  }
}
async function hostRestart(){
  clearInterval(pollHandle);
  await safeDelete(kCurrentSession);
  sessionId = null; hostState = null; role = null; playersMap = {};
  render();
}

/* ---------------- Player actions ---------------- */
async function playerJoin(name){
  if(!name.trim()) return;
  playerName = name.trim();
  playerId = uid();
  playerDoc = { name: playerName, joinedAt: Date.now(), answers:{} };
  await savePlayerDoc();
  render();
}
async function playerSubmitAnswer(val){
  playerDoc.answers[hostState.currentIndex] = parseFloat(val);
  await savePlayerDoc();
  render();
}

/* ---------------- Init / role select ---------------- */
function init(){ render(); }
function chooseRole(r){
  role = r;
  if(r === 'player'){ playerWaitForSession(); }
  render();
}

/* ---------------- Rendering ---------------- */
const app = document.getElementById('app');

function render(){
  if(!role) return renderRoleSelect();
  if(role === 'host') return renderHost();
  if(role === 'player') return renderPlayer();
}

function renderRoleSelect(){
  app.innerHTML = `
    <div class="role-choice stack">
      <div class="center stack" style="gap:4px;margin-bottom:10px;">
        <div class="eyebrow">Jeu d'ambiance</div>
        <h1 style="font-size:38px;">🎯 Le Juste Prix</h1>
        <p class="muted">Devinez le prix, le plus proche gagne !</p>
      </div>
      <button class="role-btn" id="pick-host">
        <div class="emoji">📺</div>
        <div><div class="title">Je suis l'animateur</div><div class="desc">Écran à afficher sur la TV, pilote la partie</div></div>
      </button>
      <button class="role-btn" id="pick-player">
        <div class="emoji">📱</div>
        <div><div class="title">Je suis un joueur</div><div class="desc">Réponds depuis ton téléphone</div></div>
      </button>
    </div>
  `;
  document.getElementById('pick-host').onclick = () => chooseRole('host');
  document.getElementById('pick-player').onclick = () => chooseRole('player');
}

/* ---------- HOST VIEWS ---------- */
function renderHost(){
  if(!sessionId){
    app.innerHTML = `
      <div class="role-choice stack center">
        <div class="eyebrow">Écran animateur</div>
        <h1>📺 Le Juste Prix</h1>
        <p class="muted">Crée une partie pour générer le QR code de connexion.</p>
        <button class="btn big" id="create-btn">Créer une nouvelle partie</button>
      </div>`;
    document.getElementById('create-btn').onclick = (e) => {
      e.target.disabled = true;
      e.target.textContent = 'Chargement…';
      hostCreateSession();
    };
    return;
  }
  if(hostState.phase === 'setup') return renderHostSetup();
  if(hostState.phase === 'lobby') return renderHostLobby();
  if(hostState.phase === 'question') return renderHostQuestion();
  if(hostState.phase === 'reveal') return renderHostReveal();
  if(hostState.phase === 'leaderboard') return renderHostLeaderboard();
  if(hostState.phase === 'podium') return renderHostPodium();
}

function renderHostSetup(){
  const total = hostState.questions.length;
  const rows = hostState.questions.map((q, i) => `
    <div class="setup-item">
      <div class="row" style="align-items:center;margin-bottom:8px;justify-content:space-between;">
        <span class="badge-idx">${i+1}/${total}</span>
        <button class="btn secondary" style="padding:6px 12px;font-size:14px;" data-remove="${i}" ${total<=1?'disabled':''}>🗑️ Supprimer</button>
      </div>
      <div class="row">
        <div style="flex:2;min-width:180px;">
          <label>Objet</label>
          <input type="text" data-idx="${i}" data-field="title" value="${q.title.replace(/"/g,'&quot;')}">
        </div>
        <div style="flex:1;min-width:110px;">
          <label>Prix (€)</label>
          <input type="number" min="0" step="0.01" data-idx="${i}" data-field="price" value="${q.price}">
        </div>
        <div style="flex:2;min-width:180px;">
          <label>Image (URL, optionnel)</label>
          <input type="url" data-idx="${i}" data-field="image" value="${q.image.replace(/"/g,'&quot;')}" placeholder="https://...">
        </div>
      </div>
      <div class="row" style="margin-top:8px;">
        <div style="flex:1;">
          <label>Description (optionnel)</label>
          <input type="text" data-idx="${i}" data-field="description" value="${(q.description||'').replace(/"/g,'&quot;')}" placeholder="Détails à afficher sous le titre...">
        </div>
      </div>
    </div>
  `).join('');
  app.innerHTML = `
    <div class="stack">
      <div class="center stack" style="gap:2px;">
        <div class="eyebrow">Partie ${sessionId}</div>
        <h1>🛠️ Prépare tes questions</h1>
        <p class="muted small">Renseigne l'objet et son juste prix. L'image est facultative. Ajoute ou supprime des questions librement (${total} pour l'instant).</p>
      </div>
      ${errorMsg ? `<div class="card" style="border-color:var(--pink);color:var(--pink);">${errorMsg}</div>` : ''}
      <div class="stack">${rows}</div>
      <div class="footer-actions">
        <button class="btn secondary" id="add-btn">➕ Ajouter une question</button>
      </div>
      <div class="footer-actions">
        <button class="btn big" id="validate-btn">Enregistrer et passer au salon d'attente →</button>
      </div>
    </div>
  `;
  app.querySelectorAll('input[data-idx]').forEach(inp => {
    inp.addEventListener('change', (e) => {
      const i = parseInt(e.target.dataset.idx);
      const f = e.target.dataset.field;
      hostState.questions[i][f] = e.target.value;
    });
  });
  app.querySelectorAll('button[data-remove]').forEach(b => {
    b.addEventListener('click', (e) => hostRemoveQuestion(parseInt(e.target.dataset.remove)));
  });
  document.getElementById('add-btn').onclick = hostAddQuestion;
  document.getElementById('validate-btn').onclick = hostValidateSetup;
}

function renderHostLobby(){
  const url = window.location.href;
  const roster = Object.entries(playersMap).map(([id,d]) => ({id, name:d.name}));
  const chips = roster.map(p => `<div class="roster-chip">🙋 ${p.name}</div>`).join('') || `<span class="muted small">En attente de joueurs…</span>`;
  app.innerHTML = `
    <div class="stack center">
      <div class="eyebrow">Salon d'attente</div>
      <h1>Rejoins la partie !</h1>
      <div id="qr-holder" class="qr-wrap"></div>
      <div class="code-badge">PARTIE ${sessionId}</div>
      <p class="muted small">Scanne le QR code avec ton téléphone, aucune installation nécessaire.</p>
      <div class="card" style="width:100%;max-width:640px;">
        <h3 style="margin-bottom:10px;">👥 Joueurs connectés (<span class="num" id="roster-count">${roster.length}</span>)</h3>
        <div class="row" id="roster-list">${chips}</div>
      </div>
      <button class="btn big" id="start-btn">🚀 Démarrer la partie</button>
    </div>
  `;
  new QRCode(document.getElementById('qr-holder'), { text:url, width:200, height:200, colorDark:'#120B2E', colorLight:'#ffffff' });
  document.getElementById('start-btn').onclick = hostStartGame;
}

function renderHostQuestion(){
  const q = hostState.questions[hostState.currentIndex];
  app.innerHTML = `
    <div class="stack center">
      <div class="eyebrow">Question ${hostState.currentIndex+1} / ${hostState.questions.length}</div>
      <div class="price-tag" style="max-width:600px;">
        <div class="obj-title">${q.title}</div>
        ${q.description ? `<p class="muted" style="margin-top:8px;">${q.description}</p>` : ''}
        ${q.image ? `<img src="${q.image}" alt="${q.title}">` : ''}
      </div>
      <div class="row" style="justify-content:center;">
        <button class="btn secondary" id="check-btn">🔄 Combien ont répondu ?</button>
      </div>
      ${answeredCount !== null ? `<p class="muted">Réponses reçues : <span class="num" style="color:var(--gold);font-weight:700;">${answeredCount}</span> / ${Object.keys(playersMap).length}</p>` : ''}
      <button class="btn pink big" id="reveal-btn">🎉 Révéler maintenant</button>
    </div>
  `;
  document.getElementById('check-btn').onclick = hostCheckAnswers;
  document.getElementById('reveal-btn').onclick = hostReveal;
}

function renderHostReveal(){
  const q = hostState.questions[hostState.currentIndex];
  const list = hostState.results[hostState.currentIndex] || [];
  const rowsHtml = list.map((e,i) => `
    <div class="answer-row">
      <div class="medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':''}</div>
      <div class="name">${e.name}</div>
      <div class="val">${euro(e.answer)}</div>
      <div class="pts">+${e.points} pt${e.points>1?'s':''}</div>
    </div>
  `).join('') || `<p class="muted">Aucune réponse reçue pour cette question.</p>`;

  const totals = overallTotals();
  const lbRows = totals.map((p,i) => `
    <div class="lb-row ${i===0?'top1':''}">
      <div class="rank num">${i+1}</div>
      <div class="name">${p.name}</div>
      <div class="score num">${p.score} pt${p.score>1?'s':''}</div>
    </div>
  `).join('') || `<p class="muted">Pas encore de joueurs classés.</p>`;

  const isLast = hostState.currentIndex >= hostState.questions.length - 1;

  app.innerHTML = `
    <div class="stack center">
      <div class="eyebrow">Question ${hostState.currentIndex+1} / ${hostState.questions.length}</div>
      <div class="row" style="justify-content:center;align-items:flex-start;gap:24px;flex-wrap:wrap;width:100%;">
        <div style="flex:1;min-width:320px;max-width:560px;">
          <div class="price-tag">
            <div class="obj-title">${q.title}</div>
            <div class="price-reveal num">${euro(parseFloat(q.price))}</div>
          </div>
          <div class="card answer-grid" style="margin-top:14px;text-align:left;">
            ${rowsHtml}
          </div>
        </div>
        <div class="card" style="flex:1;min-width:260px;max-width:380px;text-align:left;">
          <h3 style="margin-bottom:10px;">📊 Classement général</h3>
          <div class="stack">${lbRows}</div>
        </div>
      </div>
      <button class="btn big" id="next-btn">${isLast ? '🏆 Voir le podium final' : 'Question suivante →'}</button>
    </div>
  `;
  document.getElementById('next-btn').onclick = hostNextOrPodium;
}

function renderHostLeaderboard(){
  const totals = overallTotals();
  const rows = totals.map((p,i) => `
    <div class="lb-row ${i===0?'top1':''}">
      <div class="rank num">${i+1}</div>
      <div class="name">${p.name}</div>
      <div class="score num">${p.score} pt${p.score>1?'s':''}</div>
    </div>
  `).join('') || `<p class="muted">Pas encore de joueurs classés.</p>`;
  const isLast = hostState.currentIndex >= hostState.questions.length - 1;
  app.innerHTML = `
    <div class="stack center">
      <div class="eyebrow">Après la question ${hostState.currentIndex+1}</div>
      <h1>📊 Classement général</h1>
      <div class="stack" style="width:100%;max-width:600px;">${rows}</div>
      <button class="btn big" id="next-btn">${isLast ? '🏆 Voir le podium final' : 'Question suivante →'}</button>
    </div>
  `;
  document.getElementById('next-btn').onclick = hostNextOrPodium;
}

function renderHostPodium(){
  const totals = overallTotals();
  const [p1,p2,p3] = [totals[0], totals[1], totals[2]];
  app.innerHTML = `
    <div class="stack center">
      <div class="eyebrow">Partie terminée</div>
      <h1>🏆 Podium final</h1>
      <div class="podium">
        ${p2 ? `<div class="place p2"><div class="medal">🥈</div><div class="name">${p2.name}</div><div class="score num">${p2.score} pts</div></div>` : ''}
        ${p1 ? `<div class="place p1"><div class="medal">🥇</div><div class="name">${p1.name}</div><div class="score num">${p1.score} pts</div></div>` : ''}
        ${p3 ? `<div class="place p3"><div class="medal">🥉</div><div class="name">${p3.name}</div><div class="score num">${p3.score} pts</div></div>` : ''}
      </div>
      <button class="btn big" id="restart-btn" style="max-width:320px;">🔁 Nouvelle partie</button>
    </div>
  `;
  document.getElementById('restart-btn').onclick = hostRestart;
}

/* ---------- PLAYER VIEWS ---------- */
function renderPlayer(){
  if(!sessionId || !hostState){
    app.innerHTML = `
      <div class="role-choice stack center">
        <div class="eyebrow">Écran joueur</div>
        <h1>⏳ En attente…</h1>
        <p class="muted">L'animateur n'a pas encore créé de partie. Reste sur cette page.</p>
      </div>`;
    return;
  }
  if(!playerDoc){
    if(hostState.phase === 'setup'){
      app.innerHTML = `
        <div class="role-choice stack center">
          <div class="eyebrow">Partie ${sessionId}</div>
          <h1>🛠️ Préparation en cours…</h1>
          <p class="muted">L'animateur prépare les questions, patiente un instant.</p>
        </div>`;
      return;
    }
    app.innerHTML = `
      <div class="role-choice stack center">
        <div class="eyebrow">Partie ${sessionId}</div>
        <h1>👋 Quel est ton prénom ?</h1>
        <input type="text" id="name-input" placeholder="Ton prénom" maxlength="20">
        <button class="btn big" id="join-btn">Rejoindre la partie</button>
      </div>`;
    document.getElementById('join-btn').onclick = () => playerJoin(document.getElementById('name-input').value);
    return;
  }
  if(hostState.phase === 'lobby') return renderPlayerLobby();
  if(hostState.phase === 'question') return renderPlayerQuestion();
  if(hostState.phase === 'reveal') return renderPlayerReveal();
  if(hostState.phase === 'leaderboard') return renderPlayerLeaderboard();
  if(hostState.phase === 'podium') return renderPlayerPodium();
}

function renderPlayerLobby(){
  app.innerHTML = `
    <div class="role-choice stack center">
      <div class="eyebrow">Bienvenue ${playerDoc.name} 👋</div>
      <h1>⏳ En attente du démarrage…</h1>
      <p class="muted">${Object.keys(playersMap).length} joueur(s) déjà connecté(s). Regarde l'écran de l'animateur !</p>
    </div>`;
}

function renderPlayerQuestion(){
  const idx = hostState.currentIndex;
  const q = hostState.questions[idx];
  const already = playerDoc.answers[idx];
  if(already !== undefined && already !== null && already !== ''){
    app.innerHTML = `
      <div class="role-choice stack center">
        <div class="eyebrow">Question ${idx+1} / ${hostState.questions.length}</div>
        <div class="price-tag">
          <div class="obj-title">${q.title}</div>
          ${q.description ? `<p class="muted" style="margin-top:8px;">${q.description}</p>` : ''}
          ${q.image ? `<img src="${q.image}" alt="${q.title}">` : ''}
        </div>
        <h2>✅ Réponse envoyée : ${euro(already)}</h2>
        <p class="muted">En attente de la révélation par l'animateur…</p>
      </div>`;
    return;
  }
  app.innerHTML = `
    <div class="role-choice stack center">
      <div class="eyebrow">Question ${idx+1} / ${hostState.questions.length}</div>
      <div class="price-tag">
        <div class="obj-title">${q.title}</div>
        ${q.description ? `<p class="muted" style="margin-top:8px;">${q.description}</p>` : ''}
        ${q.image ? `<img src="${q.image}" alt="${q.title}">` : ''}
      </div>
      <label>Ton estimation (€)</label>
      <input type="number" id="ans-input" min="0" step="0.01" placeholder="Ex : 49.90" inputmode="decimal">
      <button class="btn big pink" id="submit-btn">Valider ma réponse</button>
    </div>`;
  document.getElementById('submit-btn').onclick = () => {
    const v = document.getElementById('ans-input').value;
    if(v === '' || isNaN(parseFloat(v))) return;
    playerSubmitAnswer(v);
  };
}

function renderPlayerReveal(){
  const idx = hostState.currentIndex;
  const q = hostState.questions[idx];
  const list = hostState.results[idx] || [];
  const mine = list.find(e => e.id === playerId);
  const rank = mine ? list.indexOf(mine) : -1;
  app.innerHTML = `
    <div class="role-choice stack center">
      <div class="eyebrow">Le juste prix était…</div>
      <div class="price-tag">
        <div class="obj-title">${q.title}</div>
        <div class="price-reveal num">${euro(parseFloat(q.price))}</div>
      </div>
      ${mine
        ? `<h2>${rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':'👏'} Ta réponse : ${euro(mine.answer)} — +${mine.points} pt${mine.points>1?'s':''}</h2>`
        : `<h2 class="muted">Tu n'as pas répondu à temps 😅</h2>`}
      <p class="muted">En attente de l'animateur pour la suite…</p>
    </div>`;
}

function renderPlayerLeaderboard(){
  const totals = overallTotals();
  const rows = totals.map((p,i) => `
    <div class="lb-row ${p.id===playerId?'me':''} ${i===0?'top1':''}">
      <div class="rank num">${i+1}</div>
      <div class="name">${p.name}${p.id===playerId?' (toi)':''}</div>
      <div class="score num">${p.score} pt${p.score>1?'s':''}</div>
    </div>
  `).join('');
  app.innerHTML = `
    <div class="role-choice stack center">
      <div class="eyebrow">Classement général</div>
      <h1>📊</h1>
      <div class="stack" style="width:100%;">${rows}</div>
      <p class="muted small">La prochaine question arrive…</p>
    </div>`;
}

function renderPlayerPodium(){
  const totals = overallTotals();
  const mine = totals.findIndex(p => p.id === playerId);
  const [p1,p2,p3] = [totals[0], totals[1], totals[2]];
  app.innerHTML = `
    <div class="role-choice stack center">
      <div class="eyebrow">Partie terminée</div>
      <h1>🏆 Podium final</h1>
      <div class="podium">
        ${p2 ? `<div class="place p2"><div class="medal">🥈</div><div class="name">${p2.name}</div><div class="score num">${p2.score} pts</div></div>` : ''}
        ${p1 ? `<div class="place p1"><div class="medal">🥇</div><div class="name">${p1.name}</div><div class="score num">${p1.score} pts</div></div>` : ''}
        ${p3 ? `<div class="place p3"><div class="medal">🥉</div><div class="name">${p3.name}</div><div class="score num">${p3.score} pts</div></div>` : ''}
      </div>
      ${mine>=0 ? `<p class="muted">Ta place : <b style="color:var(--text)">${mine+1}ᵉ</b> avec ${totals[mine].score} points.</p>` : ''}
    </div>`;
}

init();

</script>
</body>
</html>
